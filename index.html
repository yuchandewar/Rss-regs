<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join RSS Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #FF9933; }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .btn-gradient {
      background-image: linear-gradient(to right, #FF8C00, #FFA500, #FFD700);
      transition: all 0.2s ease-in-out;
    }
    .btn-gradient:hover {
      background-image: linear-gradient(to right, #FFA500, #FFD700, #FFEC8B);
      transform: scale(1.05);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-[#FF9933] min-h-screen flex items-center justify-center py-10">
  <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-4xl">

    <div class="bg-orange-500 text-white p-6 rounded-lg mb-8 flex flex-col items-center justify-center text-center">
      <h1 class="text-2xl font-semibold mb-4">महाविद्यालयीन विद्यार्थी आयाम नागपूर महानगर</h1>
      <img src="https://i.pinimg.com/736x/b0/83/9d/b0839d3bc8147e134ad21bf1049c7cf7.jpg" alt="RSS College Student Wing Nagpur" class="h-28 w-28 object-contain rounded-full shadow-lg">
      <p class="text-xl font-bold mt-4">Join RSS Drive</p>
    </div>

    <p class="text-center text-gray-600 mb-6 text-sm">Fields marked with <span class="text-red-500">*</span> are mandatory</p>

    <form action="https://formspree.io/f/mzzvrkkk" method="POST" class="space-y-6">

      <!-- Applicant Info -->
      <div class="bg-orange-500 text-white px-4 py-2 rounded-t-lg font-semibold text-lg">Applicant Information</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 border border-gray-200 rounded-b-lg">

        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"><span class="text-red-500">*</span>NAME</label>
          <input type="text" name="name" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Full Name" required>
        </div>

        <!-- Gender -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"><span class="text-red-500">*</span>GENDER</label>
          <div class="flex space-x-4">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female" required> Female</label>
          </div>
        </div>

        <!-- Age -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">AGE</label>
          <input type="number" name="age" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Age">
        </div>

        <!-- Profession -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PROFESSION</label>
          <input type="text" name="profession" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Profession">
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"><span class="text-red-500">*</span>PHONE NO</label>
          <input type="tel" name="phone" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Phone Number" required>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"><span class="text-red-500">*</span>E-MAIL</label>
          <input type="email" name="email" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="E-Mail" required>
        </div>

        <!-- College -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">COLLEGE NAME</label>
          <input type="text" name="college" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="College Name">
        </div>

        <!-- Degree -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">DEGREE</label>
          <input type="text" name="degree" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Degree">
        </div>

        <!-- Course -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">COURSE</label>
          <input type="text" name="course" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Course">
        </div>

        <!-- Year -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">YEAR</label>
          <input type="text" name="year" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="e.g., 2025 or Final Year">
        </div>

        <!-- Why Join RSS -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">WHY DO YOU WANT TO JOIN RSS?</label>
          <textarea name="whyJoin" rows="3" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Please explain..."></textarea>
        </div>

      </div>

      <!-- Address Section -->
      <div class="bg-orange-500 text-white px-4 py-2 rounded-t-lg font-semibold text-lg">Address Information</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 border border-gray-200 rounded-b-lg">

        <!-- City locked -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">CITY</label>
          <input type="text" value="Nagpur" disabled class="block w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100">
        </div>

        <!-- Village/City -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">VILLAGE / CITY</label>
          <input type="text" name="villageCity" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Enter Village or City">
        </div>

        <!-- Current Address -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">CURRENT ADDRESS</label>
          <textarea name="currentAddress" rows="2" class="block w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Enter your current address..."></textarea>
        </div>

      </div>

      <!-- WhatsApp Group -->
      <div class="bg-orange-500 text-white px-4 py-2 rounded-t-lg font-semibold text-lg">Join WhatsApp Group</div>
      <div class="flex flex-col items-center p-4 border border-gray-200 rounded-b-lg">
        <p class="text-gray-600 mb-4 text-sm">Click the button below to join our WhatsApp group.</p>
        <a href="https://chat.whatsapp.com/EjqcQxXpoluGaBbfW1lFqC" target="_blank" class="py-3 px-8 rounded-md text-white btn-gradient">Join WhatsApp Group</a>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-center mt-8">
        <button type="submit" class="py-3 px-8 rounded-md text-white btn-gradient">Submit</button>
      </div>

    </form>
  </div>
</body>
</html>
